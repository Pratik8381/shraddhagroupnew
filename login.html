<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · Ganesh Mandal</title>

    <link rel="stylesheet" href="css/style.css" />

    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("gm_theme") || "light";
    </script>
  </head>

  <body style="align-items: center; justify-content: center; padding: 16px">
    <form
      class="card"
      id="login"
      style="width: 100%; max-width: 380px; text-align: center"
    >
      <!-- Mandal Logo -->
      <img
        src="images/mandal-logo.png"
        alt="Ganesh Mandal Logo"
        style="width: 300px; height: 150px; object-fit: contain; display: block"
      />

      <!-- <h2 style="margin: 0 0 4px">Ganesh Mandal</h2> -->

      <p style="color: var(--muted); margin: 0 0 18px">Committee login</p>

      <div class="f" style="text-align: left">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
      </div>

      <div class="f" style="text-align: left">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        />
      </div>

      <span class="err" id="msg" role="alert"></span>

      <button
        class="btn primary"
        id="go"
        type="submit"
        style="width: 100%; margin-top: 8px"
      >
        Sign in
      </button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
